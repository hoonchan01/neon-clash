<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON CLASH 캐릭터 프로필</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
html,body{margin:0}

/* Layout: one fighter per page — big face + full body on the left, bilingual stat sheet (Korean, Japanese in brackets) on the right; prev/next and a face strip to page through. Single dark theme on purpose. */
:root{
  --bg:#0e0c16; --panel:#17142a; --panel2:#1e1a36; --line:#2c2748; --fg:#ece8ff; --muted:#9a93bd; --ja:#b9b2dc;
  --neon:#ff3d81; --cyan:#3fd8ff; --gold:#ffd23f; --tbd:#ff9f43;
  --display:"Chakra Petch","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);margin:0;letter-spacing:.02em}
h1 b{color:var(--neon)} h1 i{color:var(--cyan);font-style:normal}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{all:unset;cursor:pointer;font-family:var(--display);font-weight:700;font-size:13.5px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--neon);border-color:var(--neon);color:#1a0612}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.strip button{all:unset;cursor:pointer;flex:0 0 auto;width:52px;height:52px;border-radius:8px;overflow:hidden;border:2px solid transparent;opacity:.55}
.strip button[aria-current="true"]{border-color:var(--neon);opacity:1}
.strip button:hover{opacity:1}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.page{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.page.boss{border-color:#6b2a4a}
@media (max-width:760px){.page{grid-template-columns:minmax(0,1fr)}}
.pics{display:flex;flex-direction:column;gap:12px;align-items:center}
.face{width:100%;max-width:200px;aspect-ratio:1;border-radius:12px;object-fit:cover;background:var(--panel2);border:1px solid var(--line)}
.body{max-height:300px;max-width:100%;object-fit:contain}
.no{font-family:var(--display);color:var(--muted);font-size:13px;letter-spacing:.12em}
.info{display:flex;flex-direction:column;gap:12px;min-width:0}
.name{font-family:var(--display);font-size:clamp(30px,4.6vw,44px);font-weight:700;line-height:1.05}
.name .j{font-family:"Noto Sans JP",var(--body);font-size:.55em;font-weight:500;color:var(--ja);margin-left:6px}
.en{font-family:var(--display);font-size:13px;letter-spacing:.16em;color:var(--muted)}
.role{font-weight:700;color:var(--gold)}
.page.boss .role{color:var(--neon)}
.j{color:var(--ja);font-family:"Noto Sans JP",var(--body)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:14.5px}
dt{color:var(--muted);white-space:nowrap} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tbd{color:var(--tbd);font-weight:500}
.desc{margin:0;white-space:pre-wrap}
.desc.j{font-size:14px;line-height:1.75}
.moves{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;border-top:1px solid var(--line);padding-top:10px;font-size:14.5px}
.moves b{font-family:var(--display);color:var(--cyan)}
.moves b.s{color:var(--neon)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{all:unset;cursor:pointer;font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid var(--line);color:var(--fg)}
.btn.primary{background:var(--neon);border-color:var(--neon);color:#1a0612}
.btn[disabled]{opacity:.4;cursor:default}
.count{font-family:var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.status{font-size:12.5px;color:var(--muted)}
.form{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px 8px;font-size:13px;align-items:start}
.form .h{color:var(--muted);font-size:12px}
.form label{color:var(--muted);padding-top:6px}
.form input,.form textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0;width:100%;box-sizing:border-box}
.form textarea{min-height:130px;resize:vertical}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)} .form .h{display:none}}
.err{color:var(--neon);font-size:13px;margin:0}
.mystery{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:center}
.mystery .q{font-family:var(--display);font-size:120px;line-height:1;color:var(--neon);text-shadow:0 0 30px rgba(255,61,129,.5)}
.mystery .t{font-family:var(--display);font-size:22px;font-weight:700}
.strip .lock{display:flex;align-items:center;justify-content:center;background:var(--panel2);font-family:var(--display);font-size:24px;color:var(--muted)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:28px;color:var(--muted);text-align:center}
</style>

</head><body>
<div class="wrap">
  <div class="top">
    <a href="../" style="color:var(--muted);font-size:13px;text-decoration:none">← NEON CLASH</a>
    <h1><b>NEON</b> <i>CLASH</i> 캐릭터 프로필 <span class="j" style="font-size:.6em">キャラクタープロフィール</span></h1>
    <span class="status" id="status" role="status"></span>
  </div>
  <div class="tabs" role="group" aria-label="장 선택">
    <button type="button" data-ch="0">전체 (すべて)</button><button type="button" data-ch="1">1장 (第1章)</button><button type="button" data-ch="2">2장 (第2章)</button><button type="button" data-ch="3">3장 (第3章)</button><button type="button" data-ch="4">4장 (第4章)</button><button type="button" data-ch="5">5장 (第5章)</button><button type="button" data-ch="6">6장 (第6章)</button>
  </div>
  <div class="strip" id="strip" aria-label="캐릭터 목록"></div>
  <div id="main"></div>
  <div class="nav">
    <button class="btn" type="button" id="prev">← 이전</button>
    <span class="count" id="count"></span>
    <button class="btn" type="button" id="next">다음 →</button>
  </div>
</div>

<script>
const TXT = ['ko','role','age','job','style','weapon','likes','dislikes','X','S','desc'];
const LABEL = {ko:'이름 (名前)',en:'영문',role:'역할 (役割)',age:'나이 (年齢)',job:'직업 (職業)',height:'키 (身長)',style:'스타일 (スタイル)',weapon:'무기 (武器)',likes:'좋아함 (好きなもの)',dislikes:'싫어함 (嫌いなもの)',X:'고유기 X',S:'필살기 MAX+X',desc:'설명 (説明)'};
const ORDER = ['ko','en','role','age','job','height','style','weapon','likes','dislikes','X','S','desc'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const blank = v => v == null || v === '';
const ja = (p, k) => p.ja ? p.ja[k] : null;
function both(p, k) {           // Korean (Japanese)
  const a = p[k], b = ja(p, k);
  if (blank(a) && blank(b)) return '<span class="tbd">미정 (未定)</span>';
  const ko = blank(a) ? '<span class="tbd">미정</span>' : esc(a);
  return blank(b) || b === a ? ko : `${ko} <span class="j">(${esc(b)})</span>`;
}
let rows = [], list = [], idx = 0, ch = 0, editing = false, canWrite = false, errMsg = '';
try { ch = +(localStorage.getItem('nc_prof_ch') || 0) } catch (e) {}

function view(p) {
  const boss = /보스/.test(p.role || '');
  const pics = `<div class="pics"><img class="face" src="img/${p.key}_face.webp" alt="${esc(p.ko)}"><div class="no">CHAPTER ${p.ch} · ${String(p.order).padStart(2,'0')}</div></div>`;
  if (editing) {
    const f = ORDER.map(k => {
      const shared = k === 'en' || k === 'height';
      const inp = (id, v) => k === 'desc' ? `<textarea id="${id}">${esc(v)}</textarea>` : `<input id="${id}" value="${esc(v)}">`;
      return `<label for="k_${k}">${LABEL[k]}</label>${inp('k_' + k, p[k])}${shared ? '<span></span>' : inp('j_' + k, ja(p, k))}`;
    }).join('');
    return `<article class="page${boss ? ' boss' : ''}">${pics}<div class="info">
      <div class="form"><span></span><span class="h">한국어</span><span class="h">日本語</span>${f}</div>
      <p class="status">빈칸으로 저장하면 '미정 (未定)'으로 표시돼요. 나이를 고치면 (추정) 표시는 사라져요.</p>
      ${errMsg ? `<p class="err">${esc(errMsg)}</p>` : ''}
      <div class="nav"><span></span><span style="display:flex;gap:8px"><button class="btn" type="button" id="cancel">취소</button><button class="btn primary" type="button" id="save">저장</button></span></div></div></article>`;
  }
  return `<article class="page${boss ? ' boss' : ''}">${pics}<div class="info">
    <div><div class="name">${esc(p.ko)}${!blank(ja(p,'ko')) ? `<span class="j">(${esc(ja(p,'ko'))})</span>` : ''}</div><div class="en">${esc(p.en)}</div></div>
    <div class="role">${both(p,'role')}</div>
    <dl>
      <dt>${LABEL.age}</dt><dd>${both(p,'age')}${p.ageEst ? ' <span class="status">(추정 / 推定)</span>' : ''}</dd>
      <dt>${LABEL.height}</dt><dd>${blank(p.height) ? '<span class="tbd">미정 (未定)</span>' : esc(p.height) + ' cm'}</dd>
      <dt>${LABEL.job}</dt><dd>${both(p,'job')}</dd>
      <dt>${LABEL.style}</dt><dd>${both(p,'style')}</dd>
      <dt>${LABEL.weapon}</dt><dd>${both(p,'weapon')}</dd>
      <dt>${LABEL.likes}</dt><dd>${both(p,'likes')}</dd>
      <dt>${LABEL.dislikes}</dt><dd>${both(p,'dislikes')}</dd>
    </dl>
    <p class="desc">${blank(p.desc) ? '<span class="tbd">미정 (未定)</span>' : esc(p.desc)}</p>
    ${!blank(ja(p,'desc')) ? `<p class="desc j">(${esc(ja(p,'desc'))})</p>` : ''}
    <div class="moves"><b>X</b><span>${both(p,'X')}</span><b class="s">MAX+X</b><span>${both(p,'S')}</span></div>
    ${canWrite ? '<div class="nav"><span></span><button class="btn" type="button" id="edit">수정 (編集)</button></div>' : ''}
  </div></article>`;
}
function filtered() { return rows.filter(p => !ch || p.ch === ch).sort((a, b) => a.ch - b.ch || a.order - b.order); }
function render(keepKey) {
  document.querySelectorAll('[data-ch]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.ch === ch));
  if (ch >= 4) {
    document.getElementById('strip').innerHTML = Array.from({length: 8}, () => '<button type="button" class="lock" disabled>?</button>').join('');
    document.getElementById('main').innerHTML = `<div class="mystery"><div class="q">?</div><div class="t">${ch}장 (第${ch}章)</div><div class="status">??? · 공개 예정 (近日公開)</div></div>`;
    document.getElementById('count').textContent = '? / ?';
    document.getElementById('prev').disabled = true; document.getElementById('next').disabled = true;
    return;
  }
  if (!rows.length) return;
  const key = keepKey || (list[idx] && list[idx].key);
  list = filtered();
  const at = list.findIndex(p => p.key === key); idx = at >= 0 ? at : Math.min(idx, list.length - 1);
  const p = list[idx];
  document.getElementById('strip').innerHTML = list.map((q, i) => `<button type="button" data-i="${i}" aria-current="${i === idx}" title="${esc(q.ko)}"><img src="img/${q.key}_face.webp" alt="${esc(q.ko)}"></button>`).join('');
  document.querySelector('.strip [aria-current="true"]')?.scrollIntoView({block:'nearest', inline:'center'});
  document.getElementById('main').innerHTML = view(p);
  document.getElementById('count').textContent = `${idx + 1} / ${list.length}`;
  document.getElementById('prev').disabled = editing; document.getElementById('next').disabled = editing;
  try { if (location.hash.slice(1) !== p.key) history.replaceState(null, '', '#' + p.key) } catch (e) {}
}
function go(d) { if (editing || !list.length) return; idx = (idx + d + list.length) % list.length; render(list[idx].key); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', e => { if (editing || /INPUT|TEXTAREA/.test(e.target.tagName)) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
let tx = null;
document.getElementById('main').addEventListener('touchstart', e => { tx = e.touches[0].clientX }, {passive:true});
document.getElementById('main').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1); tx = null });
document.getElementById('strip').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b && !editing) { idx = +b.dataset.i; render(list[idx].key); } });
document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { if (editing) return; ch = +b.dataset.ch; try { localStorage.setItem('nc_prof_ch', ch) } catch (e) {} idx = 0; render(filtered()[0]?.key); });
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (k && !editing) { if (ch && !rows.find(p => p.key === k && p.ch === ch)) ch = 0; render(k); } });
document.getElementById('main').addEventListener('click', async e => {
  const id = e.target.id, p = list[idx];
  if (id === 'edit') { editing = true; errMsg = ''; render(p.key); document.getElementById('k_ko')?.focus(); }
  else if (id === 'cancel') { editing = false; errMsg = ''; render(p.key); }
  else if (id === 'save') {
    const patch = {}, jp = {};
    for (const k of ORDER) {
      let v = document.getElementById('k_' + k).value.trim();
      if (k === 'height') v = v === '' ? null : (isNaN(+v) ? v : +v); else if (v === '') v = null;
      if ((p[k] ?? null) !== v) patch[k] = v;
      const je = document.getElementById('j_' + k);
      if (je) { const w = je.value.trim() || null; if ((ja(p, k) ?? null) !== w) jp[k] = w; }
    }
    if (Object.keys(jp).length) patch.ja = jp;
    if (!Object.keys(patch).length) { editing = false; render(p.key); return; }
    if ('age' in patch || 'age' in jp) patch.ageEst = false;
    e.target.disabled = true; e.target.textContent = '저장 중…';
    try { await db.doc('profiles/' + p.key).update(patch); editing = false; errMsg = ''; setStatus('저장했어요 (保存しました)'); render(p.key); }
    catch (err) { errMsg = err && err.code === 'permission_denied' ? '수정 권한이 없어요.' : '저장하지 못했어요. 잠시 후 다시 눌러 주세요.'; render(p.key); }
  }
});
function setStatus(s) { document.getElementById('status').textContent = s; }

rows = [{"S": "은하 퍼레이드", "X": "빛 파동", "age": "45세", "ageEst": false, "ch": 3, "desc": "안테나 개발처의 괴짜. 배 나온 중년 아저씨지만 완력이 대단하다. 썬글라스에 야광봉 2개로 겉모습은 매우 우스꽝스럽지만 중년의 나이는 속일 수 없다. 예쁜 여자에 반하는 속도 만큼 매우 빠른 공격을 구사하므로 조심해야한다.", "dislikes": "남자", "en": "ANDROMEDA", "height": 175, "ja": {"S": "銀河パレード", "X": "光の波動", "age": "45歳", "desc": "アンテナ開発室の変わり者。お腹の出た中年のおじさんだが、腕力はすさまじい。サングラスにサイリウム2本と見た目はとても滑稽だが、中年の年齢はごまかせない。美女に惚れるのと同じくらい素早い攻撃を繰り出すので要注意。", "dislikes": "男", "job": "変わり者の超能力者", "ko": "アンドロメダ", "likes": "美女", "role": "第3章 対戦相手7・アンテナ開発室", "style": "片手武器", "weapon": "サイリウム2本"}, "job": "괴짜 초능력자", "ko": "안드로메다", "likes": "미모의 여성", "order": 7, "role": "3장 상대 7 · 안테나 개발처", "style": "한손 무기", "weapon": "야광봉 2개", "key": "andromeda"}, {"S": "오렌지 이퀘이션", "X": "오렌지 스파이럴", "age": "25세", "ageEst": false, "ch": 1, "desc": "명문대에서 에너지공학을 전공한 대학생. 히어로를 존경하며 스승 료헤이를 만나 싸움을 배우기 시작한다. 처음엔 약하지만 동네의 숨은 고수들과 겨루며 강해진다. 곱슬머리에 검은 안경, 갈색 가죽 라이더 재킷 차림. 머리로 계산해서 싸우는 타입.", "dislikes": "생선", "en": "DAISUKE", "height": 169, "ja": {"S": "オレンジイクエーション", "X": "オレンジスパイラル", "age": "25歳", "desc": "名門大学でエネルギー工学を専攻する大学生。ヒーローに憧れ、師匠リョウヘイと出会って戦い方を学び始める。最初は弱いが、町に潜む達人たちと拳を交えるうちに強くなっていく。くせ毛に黒縁メガネ、茶色のレザーライダースジャケット。頭で計算して戦うタイプ。", "dislikes": "魚", "job": "大学生", "ko": "ダイスケ", "likes": "オレンジ、ヒーローもの", "role": "主人公", "style": "総合格闘術", "weapon": "なし"}, "job": "대학생", "ko": "다이스케", "likes": "오렌지, 히어로물", "order": 1, "role": "주인공", "style": "종합 격투술", "weapon": "없음", "key": "daisuke"}, {"S": "골든 스타피어스", "X": "골든 스타", "age": "35세", "ageEst": false, "ch": 1, "desc": "전직 복싱 챔피언 출신 사진작가.모델처럼 잘생긴 얼굴과 큰 체격의 소유자이다. 셔터보다 빠른 주먹이 자랑. 성실하고 꼼꼼한 성격이며 일본 전국을 방랑하며 사진을 찍는게 취미이다.", "dislikes": "달달한 음식", "en": "HARUHIKO", "height": 178, "ja": {"S": "ゴールデンスターピアス", "X": "ゴールデンスター", "age": "35歳", "desc": "元ボクシング王者の写真家。モデルのような整った顔と大きな体格の持ち主。シャッターより速い拳が自慢。真面目で几帳面な性格で、日本中を旅しながら写真を撮るのが趣味。", "dislikes": "甘い食べ物", "job": "写真家（元ボクシング王者）", "ko": "ハルヒコ", "likes": "旅行、焼肉、香水、カメラ選び", "role": "第1章 対戦相手8", "style": "ボクシング", "weapon": "なし"}, "job": "사진작가 (전직 복싱 챔피언)", "ko": "하루
