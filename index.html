<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON CLASH</title>
<meta name="description" content="NEON CLASH — Nintendo DS homebrew fighting game. Download & emulator guide.">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0816; --panel:#151026; --panel2:#1d1634; --line:#2e2550;
  --text:#ece8ff; --dim:#a69cc9; --pink:#ff3fb4; --cyan:#33d6ff; --yellow:#ffd34d; --green:#5df2a0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans KR","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;line-height:1.6}
body[data-lang=ja]{font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif}
body[data-lang=zh]{font-family:"Noto Sans SC","Noto Sans KR",system-ui,sans-serif}
a{color:var(--cyan)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:rgba(11,8,22,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-weight:900;letter-spacing:.06em;font-size:18px;white-space:nowrap}
.brand b{color:var(--pink)} .brand i{font-style:normal;color:var(--cyan)}
nav.links{display:flex;gap:14px;flex:1;overflow-x:auto;scrollbar-width:none}
nav.links a{color:var(--dim);text-decoration:none;font-size:14px;white-space:nowrap}
nav.links a:hover{color:var(--text)}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.langs button{background:none;border:0;color:var(--dim);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.langs button.on{background:var(--panel2);color:var(--text)}

.hero{padding:48px 0 24px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(40px,8vw,72px);line-height:1;margin:0 0 12px;font-weight:900;letter-spacing:.02em}
.hero h1 .n{color:var(--pink);text-shadow:0 0 18px rgba(255,63,180,.7)}
.hero h1 .c{color:var(--cyan);text-shadow:0 0 18px rgba(51,214,255,.7)}
.hero p{color:var(--dim);margin:0 0 20px}
.shots{display:flex;gap:12px;justify-content:center}
.shots img{width:48%;max-width:220px;image-rendering:pixelated;border-radius:10px;border:2px solid var(--line);background:#000}
.roster{margin:8px 0 0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.roster img{display:block;width:100%;height:auto}

section{padding:36px 0;border-top:1px solid var(--line)}
section h2{font-size:24px;margin:0 0 6px}
section .lead{color:var(--dim);margin:0 0 20px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.release-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:6px}
.tag{font-weight:900;font-size:22px;color:var(--yellow)}
.date{color:var(--dim);font-size:14px}
.badge{font-size:12px;background:var(--pink);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700}
.notes{color:var(--text);font-size:15px;margin:10px 0 16px;white-space:normal}
.notes ul{margin:6px 0;padding-left:20px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.dl a{display:block;text-decoration:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s,transform .15s}
.dl a:hover{border-color:var(--cyan);transform:translateY(-1px)}
.dl a.main{border-color:var(--pink);background:linear-gradient(135deg,rgba(255,63,180,.18),rgba(51,214,255,.12))}
.dl .t{font-weight:700;display:block}
.dl .s{font-size:12px;color:var(--dim)}
.muted{color:var(--dim)}
.err{color:#ff8a8a}
details.older{margin-top:16px}
details.older summary{cursor:pointer;color:var(--dim)}
.old{border-top:1px solid var(--line);padding:14px 0}
.old:first-of-type{border-top:0}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{color:#fff;border-color:var(--pink);background:rgba(255,63,180,.15)}
.pane{display:none}.pane.on{display:block}
.pane ol{padding-left:22px;margin:10px 0}
.pane li{margin:6px 0}
.pane .get{display:inline-block;margin:4px 8px 4px 0;padding:8px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;color:var(--text);font-weight:700;font-size:14px}
.pane .get:hover{border-color:var(--cyan)}
.note{background:rgba(255,211,77,.08);border:1px solid rgba(255,211,77,.35);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:12px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-family:inherit;font-size:.9em}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:400;font-size:13px}
footer{padding:28px 0 48px;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:28px}
  nav.links{display:none}
  header.top .wrap{justify-content:space-between}
}
</style>
</head>
<body data-lang="ko">
<header class="top"><div class="wrap">
  <div class="brand"><b>NEON</b> <i>CLASH</i></div>
  <nav class="links">
    <a href="#download" data-t="nav_dl"></a>
    <a href="#guide" data-t="nav_guide"></a>
    <a href="#controls" data-t="nav_ctrl"></a>
    <a href="#updates" data-t="nav_upd"></a>
  </nav>
  <div class="langs" role="group" aria-label="language">
    <button data-l="ko">한국어</button><button data-l="ja">日本語</button><button data-l="zh">中文</button>
  </div>
</div></header>

<main class="wrap">
  <div class="hero">
    <div>
      <h1><span class="n">NEON</span><br><span class="c">CLASH</span></h1>
      <p data-t="tagline"></p>
      <div class="roster"><img src="assets/roster.jpg" alt="roster"></div>
    </div>
    <div class="shots">
      <img src="assets/title.png" alt="title screen">
      <img src="assets/fight.png" alt="fight screen">
    </div>
  </div>

  <section id="download">
    <h2 data-t="dl_h"></h2>
    <p class="lead" data-t="dl_lead"></p>
    <div id="latest" class="card"><span class="muted" data-t="loading"></span></div>
  </section>

  <section id="guide">
    <h2 data-t="guide_h"></h2>
    <p class="lead" data-t="guide_lead"></p>
    <div class="tabs" id="tabs">
      <button data-p="win">Windows</button>
      <button data-p="android">Android</button>
      <button data-p="ios">iPhone</button>
      <button data-p="r4">DS Lite + R4</button>
    </div>
    <div class="card">
      <div class="pane" id="p-win"></div>
      <div class="pane" id="p-android"></div>
      <div class="pane" id="p-ios"></div>
      <div class="pane" id="p-r4"></div>
    </div>
  </section>

  <section id="controls">
    <h2 data-t="ctrl_h"></h2>
    <div class="card" style="overflow-x:auto"><table id="ctrl"></table></div>
  </section>

  <section id="updates">
    <h2 data-t="upd_h"></h2>
    <p class="lead" data-t="upd_lead"></p>
    <div id="history" class="card"><span class="muted" data-t="loading"></span></div>
  </section>
</main>

<footer><div class="wrap" data-t="footer"></div></footer>

function repo(){
  if (REPO_OVERRIDE) return REPO_OVERRIDE;
  const h = location.hostname, m = h.match(/^([^.]+)\.github\.io$/i);
  if (!m) return "";
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return m[1] + "/" + (seg || h);           // user site (owner.github.io) uses the host as repo name
}

let lang = "ko", releases = null, loadErr = false, saved = null;
try { saved = localStorage.getItem("nc_lang"); } catch(e) {}
if (I18N[saved]) lang = saved;
else {
  const n = (navigator.language || "").toLowerCase();
  if (n.startsWith("ja")) lang = "ja"; else if (n.startsWith("zh")) lang = "zh";
}

function kind(name){
  const n = name.toLowerCase();
  if (/_ja\b|_ja\.|ja\.zip/.test(n)) return "a_ja";
  if (/_zh\b|_zh\.|zh\.zip/.test(n)) return "a_zh";
  if (n.includes("ak2")) return "a_ak2";
  if (n.includes("r4")) return "a_r4";
  if (n.includes("emulator") || n.endsWith(".nds") || n.endsWith(".zip")) return "a_emu";
  return "a_other";
}
const ORDER = {a_emu:0,a_ja:1,a_zh:2,a_r4:3,a_ak2:4,a_other:5};
const MAIN_FOR = {ko:"a_emu", ja:"a_ja", zh:"a_zh"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mb = b => (b/1048576).toFixed(1) + " MB";
const fmtDate = d => new Date(d).toLocaleDateString({ko:"ko-KR",ja:"ja-JP",zh:"zh-CN"}[lang], {year:"numeric",month:"long",day:"numeric"});

function md(text){                     // tiny markdown: headings, bullets, bold, links
  if (!text) return "";
  const lines = esc(text).split(/\r?\n/); let out = "", inList = false;
  for (let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    const li = l.match(/^\s*[-*]\s+(.*)/);
    if (li){ if(!inList){out+="<ul>";inList=true} out+="<li>"+li[1]+"</li>"; continue; }
    if (inList){ out+="</ul>"; inList=false; }
    const h = l.match(/^#{1,6}\s+(.*)/);
    if (h) out += "<p><b>"+h[1]+"</b></p>"; else if (l.trim()) out += "<p style='margin:4px 0'>"+l+"</p>";
  }
  return out + (inList ? "</ul>" : "");
}

function assetsHTML(r){
  const t = I18N[lang];
  const list = (r.assets||[]).slice().sort((a,b)=>ORDER[kind(a.name)]-ORDER[kind(b.name)]);
  if (!list.length) return "";
  return '<div class="dl">' + list.map(a=>{
    const k = kind(a.name), [title, sub] = t[k];
    return `<a class="${k===MAIN_FOR[lang]?"main":""}" href="${esc(a.browser_download_url)}">
      <span class="t">⬇ ${esc(title)}</span>
      <span class="s">${esc(sub ? sub + " · " : "")}${esc(a.name)} · ${mb(a.size)}</span></a>`;
  }).join("") + "</div>";
}

function renderReleases(){
  const t = I18N[lang], L = document.getElementById("latest"), H = document.getElementById("history");
  if (loadErr){ L.innerHTML = H.innerHTML = `<span class="err">${t.fail}</span>`; return; }
  if (!releases){ return; }
  if (!releases.length){ L.innerHTML = H.innerHTML = `<span class="muted">${t.none}</span>`; return; }
  const r = releases[0];
  L.innerHTML = `<div class="release-head"><span class="tag">${esc(r.name||r.tag_name)}</span>
     <span class="badge">${t.latest}</span><span class="date">${fmtDate(r.published_at)}</span></div>
     <div class="notes">${md(r.body)}</div>${assetsHTML(r)}`;
  const post = (x, withFiles) => `<div class="old"><div class="release-head"><span class="tag" style="font-size:18px">${esc(x.name||x.tag_name)}</span>
     <span class="date">${fmtDate(x.published_at)}</span></div><div class="notes">${md(x.body)}</div>${withFiles?assetsHTML(x):""}</div>`;
  const older = releases.slice(1);
  H.innerHTML = releases.slice(0, 5).map(x=>post(x,false)).join("") +
    (older.length ? `<details class="older"><summary>${t.older} (${older.length})</summary>${older.map(x=>post(x,true)).join("")}</details>` : "");
}

function render(){
  const t = I18N[lang];
  document.body.dataset.lang = lang; document.documentElement.lang = {ko:"ko",ja:"ja",zh:"zh-CN"}[lang];
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelector("footer .wrap").textContent = t.footer;
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  for (const p of ["win","android","ios","r4"]) document.getElementById("p-"+p).innerHTML = t[p];
  document.getElementById("ctrl").innerHTML = t.ctrl.map((r,i)=> i ? `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>` : `<tr><th>${r[0]}</th><th>${r[1]}</th></tr>`).join("");
  renderReleases();
}

document.querySelectorAll(".langs button").forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem("nc_lang", lang); } catch(e) {} render();
});
function tab(p){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  document.querySelectorAll(".pane").forEach(el => el.classList.toggle("on", el.id === "p-"+p));
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => tab(b.dataset.p));
const ua = navigator.userAgent;
tab(/iPhone|iPad|iPod/.test(ua) ? "ios" : /Android/.test(ua) ? "android" : "win");
render();

(async () => {
  const R = repo();
  if (!R){ loadErr = true; render(); return; }
  try {
    const res = await fetch(`https://api.github.com/repos/${R}/releases?per_page=30`, {headers:{Accept:"application/vnd.github+json"}});
    if (!res.ok) throw new Error(res.status);
    releases = (await res.json()).filter(r => !r.draft);
  } catch(e){ loadErr = true; }
  render();
})();
</script>
</body>
