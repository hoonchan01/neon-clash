function escH(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

      <div class="fields"><label>아이디 (영문 소문자·숫자·_ 4~16자)<input id="aEm" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="16"></label>

      <label>닉네임 (가입 때만 · 랭킹 표시 · 비우면 아이디)<input id="aNk" maxlength="12" autocomplete="nickname"></label></div>
      <p>비밀번호를 잊으면 되찾을 수 없으니 잘 기억해 두세요.</p>

const RTABS = [['total', '전체 클리어 (1~3장)'], ['c1', '1장'], ['c2', '2장'], ['c3', '3장'], ['playMs', '총 플레이 시간']];
async function openRank(field) {
  const C = window.Cloud, box = $('rankBox'); $('rank').classList.add('open');

  const head = `<h2 id="rankT">랭킹</h2><div class="row">${tabs}</div><p>${field === 'playMs' ? '오래 플레이한 순서' : '스토리를 빨리 깬 순서 (싸운 시간만 계산)'}</p>`;
  const mine = `<p>내 기록 · ${field === 'playMs' ? fmt(SAVE.playMs) : fmt(SAVE.best[field])}</p>`;
  const close = '<div class="row"><button type="button" data-close>닫기</button></div>';

  else {
    box.innerHTML = head + mine + '<p>불러오는 중…</p>' + close;
    try {
      const rows = await C.top(field);
      const body = rows.length ? rows.map((r, i) => `<tr class="${C.user && r.uid === C.user.uid ? 'me' : ''}"><td>${i + 1}</td><td>${escH(r.nick)}</td><td>${fmt(r[field])}</td></tr>`).join('') : '<tr><td colspan="3">아직 기록이 없어요</td></tr>';
      box.innerHTML = head + mine + `<table class="rk"><thead><tr><th>#</th><th>닉네임</th><th>기록</th></tr></thead><tbody>${body}</tbody></table>` + (C.user ? '' : '<p>로그인하면 내 기록도 랭킹에 올라가요.</p>') + close;
    } catch (e) { box.innerHTML = head + mine + '<p>랭킹을 불러오지 못했어요.</p>' + close; }

  box.querySelectorAll('[data-t]').forEach(b => b.onclick = () => openRank(b.dataset.t));

// ---------- loop ----------
let last = 0, acc = 0;
let saveTick = 0;
function loop(t) { requestAnimationFrame(loop); const dt = Math.min(100, t - last); acc += dt; last = t;
  if (started && !panelOpen() && !document.hidden) { SAVE.playMs += dt; if (scene === 'fight' && F && F.story && F.phase !== 'end') SAVE.run[F.ch] = (SAVE.run[F.ch] || 0) + dt; if ((saveTick += dt) > 15000) { saveTick = 0; save(); } }
  if (acc < 1000 / 60 - 1) return; acc = 0; if (!panelOpen()) draw(); }
requestAnimationFrame(loop);
