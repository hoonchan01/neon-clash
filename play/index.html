};
let scene = 'title', dlg = null, menu = 0, sel = { p: 'daisuke', o: 'hattori', side: 0 };
function say(lines, then) { dlg = { lines, i: 0, then }; scene = 'dialog'; }
function storyNext() {
  const C = STORY[SAVE.ch];
  if (!C) { scene = 'ending'; return; }
  if (SAVE.stage === 0 && C.intro && !SAVE.introSeen) { SAVE.introSeen = SAVE.ch; save(); scene = 'chtitle'; ctT = 0; return; }

      const done = SAVE.stage >= C.fights.length;
      const after = () => { if (done) { SAVE.ch++; SAVE.stage = 0; save(); scene = SAVE.ch > 3 ? 'ending' : 'chclear'; ctT = 0; } else { save(); storyNext(); } };

  } }));
}
let ctT = 0;

// ---------- screens ----------
function txt(t, x, y, size, col, align, font) { g.font = `700 ${size}px ${font || FONT}`; g.fillStyle = col || '#fff'; g.textAlign = align || 'center'; g.fillText(t, x, y); }
function face(key, x, y, h, flip) { const r = BY[key], m = r.f.cutin, im = img(key); if (!m || !im.complete) return; const w = m[2] * h / m[3]; g.save(); g.translate(x, y); if (flip) { g.scale(-1, 1); } g.drawImage(im, m[0], m[1], m[2], m[3], flip ? -w : 0, 0, w, h); g.restore(); }
function menuList(items, y0) {
  if (take('up') || take('left')) { menu = (menu + items.length - 1) % items.length; sfx('sel'); }
  if (take('down') || take('right')) { menu = (menu + 1) % items.length; sfx('sel'); }
  items.forEach((it, i) => { const y = y0 + i * 70, on = i === menu; g.fillStyle = on ? 'rgba(255,61,129,.85)' : 'rgba(255,255,255,.08)'; g.fillRect(W / 2 - 260, y - 44, 520, 58); txt(it, W / 2, y - 5, 30, on ? '#1a0612' : '#fff');
    if (tap && tap.x > W / 2 - 260 && tap.x < W / 2 + 260 && tap.y > y - 44 && tap.y < y + 14) { menu = i; pressed.ok = true; } });
  if (take('ok') || take('F')) { sfx('sel'); return menu; }
  return -1;
}
function draw() {

function storyNextFight() { const C = STORY[SAVE.ch]; const fi = C.fights[SAVE.stage]; say(fi.pre, () => { scene = 'x'; storyNextGo(); }); }
function storyNextGo() { SAVE.introSeen = SAVE.ch; save(); const C = STORY[SAVE.ch], fi = C.fights[SAVE.stage]; dlg = null; startFightStory(C, fi); }
function startFightStory(C, fi) {

// route story starts through the chapter title once, then fights

function currentBg() { return Math.min(3, Math.max(1, (F && scene !== 'dialog') ? F.ch : SAVE.ch)); }
function wrap(t, x, y, mw, lh) { g.font = `500 28px ${FONT}`; g.fillStyle = '#fff'; g.textAlign = 'left'; let line = ''; for (const ch of t) { if (g.measureText(line + ch).width > mw) { g.fillText(line, x, y); y += lh; line = ch; } else line += ch; } g.fillText(line, x, y); }

  if ((take('ok') || take('F')) && (sel.side === 1 || unlocked(pick.key))) { sfx('sel'); if (sel.side === 0) sel.side = 1; else vsStart(); }

}

requestAnimationFrame(loop);
